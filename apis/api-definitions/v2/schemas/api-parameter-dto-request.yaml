description: |
  A method's parameter.
allOf:
  - $ref: api-parameter-dto.yaml
  - type: object
    required:
    - type
    - instance
  - type: object
    properties:
      apiParameterContentType:
        type: string
        description: |
          The content type of the parameter, either `json`, `xml`, `json/xml`, or `urlencoded`. Only applicable for top-level body parameters.
        enum:
          - json
          - xml
          - json/xml
          - urlencoded
