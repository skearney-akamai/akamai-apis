type: object
description: |
  Collect data needed for a condition match on a named attribute with optional wildcard and case-sensitivity controls.
title: MultiNameAtomicCondition
additionalProperties: false
required:
- className
- name
properties:
  className:
    type: string
    description: |
      The value for this type of condition is `MultiNameAtomicCondition`.
    enum:
    - MultiNameAtomicCondition
  positiveMatch:
    type: boolean
    description: |
      Specify whether the condition triggers on a match or lack of match.
  index:
    type: integer
    description: |
      Specify the position of this condition within the condition set.
  value:
    type: array
    description: |
      Specify values to match against the named attribute.
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  name:
    type: array
    description: |
      Specify names of the attributes to inspect.
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  nameWildcard:
    type: boolean
    description: |
      Specify whether to interpret `*` and `?` as wildcards when matching attribute names.
  valueCase:
    type: boolean
    description: |
      Specify whether to consider the case sensitivity of the provided values.
  valueWildcard:
    type: boolean
    description: |
      Specify whether to interpret `*` and `?` as wildcards when matching values.
