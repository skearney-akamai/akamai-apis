type: object
description: |
  Collect data needed for condition matches on response body content.
title: ResponseBodyCondition
additionalProperties: false
required:
- className
- value
properties:
  className:
    type: string
    description: |
      The value for this type of condition is `ResponseBodyCondition`.
    enum:
    - ResponseBodyCondition
  positiveMatch:
    type: boolean
    description: |
      Specify whether the condition triggers on a match or lack of match.
  index:
    type: integer
    description: |
      Specify the position of this condition within the condition set.
  value:
    type: array
    description: |
      Specify values to match against the response body.
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
