type: object
description: |
  Collects data needed for condition matches on file extensions.
title: FileExtensionCondition
additionalProperties: false
required:
- className
- value
properties:
  className:
    type: string
    description: |
      The value for this type of condition is `FileExtensionCondition`.
    enum:
    - FileExtensionCondition
  positiveMatch:
    type: boolean
    default: true
    description: |
      Specify whether the condition triggers on a match or lack of match.
  index:
    type: integer
    description: |
      Specify the position of this condition within the condition set.
  value:
    type: array
    description: |
      Specify file extensions to match against, without the leading dot.
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  valueCase:
    type: boolean
    description: |
      Specify whether to consider the case sensitivity of the provided file extension values.
  valueWildcard:
    type: boolean
    description: |
      Specify whether to interpret `*` and `?` as wildcards.
