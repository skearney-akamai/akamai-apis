type: object
additionalProperties: false
required:
- userApplicationId
- clientRequestId
properties:
  userApplicationId:
    type: string
    description: |
      Uniquely identifies the application you specified in the Firewall for AI configuration.
  clientRequestId:
    type: string
    description: |
      Specify a string that identifies the client request, like a database pointer, transaction ID, or log entry. The response returns this ID, providing context and correlation between the request and response.
  llmInput:
    type: string
    description: |
     The prompt sent to the LLM. If omitted, `llmOutput` is required.
  llmOutput:
    type: string
    description: |
      The response generated by the LLM. If omitted, `llmInput` is required.
