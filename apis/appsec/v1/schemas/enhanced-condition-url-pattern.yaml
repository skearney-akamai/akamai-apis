type: object
description: |
  Collect data needed for condition matches on URL patterns.
title: UrlPatternCondition
additionalProperties: false
required:
- className
- value
properties:
  className:
    type: string
    description: |
      The value for this type of condition is `UrlPatternCondition`.
    enum:
    - UrlPatternCondition
  positiveMatch:
    type: boolean
    description: |
      Specify whether the condition triggers on a match or lack of match.
  index:
    type: integer
    description: |
      Specify the position of this condition within the condition set.
  value:
    type: array
    description: |
      Specify URL patterns to match against.
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  valueCase:
    type: boolean
    description: |
      Specify whether to consider the case sensitivity of the provided URL patterns.
  valueWildcard:
    type: boolean
    description: |
      Specify whether to interpret `*` and `?` as wildcards.
