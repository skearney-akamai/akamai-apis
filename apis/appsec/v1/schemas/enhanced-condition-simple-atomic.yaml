type: object
description: |
  Collect data needed for a basic condition match on a list of values.
title: SimpleAtomicCondition
additionalProperties: false
required:
- className
- value
properties:
  className:
    type: string
    description: |
      The value for this type of condition is `SimpleAtomicCondition`.
    enum:
    - SimpleAtomicCondition
  positiveMatch:
    type: boolean
    description: |
      Specify whether the condition triggers on a match or lack of match.
  index:
    type: integer
    description: |
      Specify the position of this condition within the condition set.
  value:
    type: array
    description: |
      Specify values to match against.
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
