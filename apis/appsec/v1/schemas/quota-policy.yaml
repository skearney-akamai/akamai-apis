type: object
description: |
  Review details about a quota policy.
additionalProperties: false
required:
- matchType
- name
- quota
- interval
properties:
  matchType:
    type: string
    description: |
      Specify the match type for this quota policy, either `path` to match website paths or `api` to match API endpoints.
    enum:
    - path
    - api
  configId:
    type: integer
    format: int64
    description: |
      Uniquely identify the security configuration.
    readOnly: true
  configVersion:
    type: integer
    description: |
      Specify the version of the security configuration.
    readOnly: true
  policyId:
    type: integer
    format: int64
    description: |
      Uniquely identify each quota policy.
    readOnly: true
  name:
    type: string
    description: |
      Specify the name you assign to a quota policy.
  description:
    type: string
    description: |
      Provide descriptive text about a quota policy.
  failResponseAction:
    type: string
    description: |
      Specify the action to take when the quota check fails, either `alert` to log the event or `none` to take no action.
    enum:
    - alert
    - none
  quota:
    type: integer
    description: |
      The maximum number of requests allowed within the specified interval.
    minimum: 1
  interval:
    type: string
    description: |
      The time interval over which to count requests toward the quota limit. Either `ONE_HOUR`, `THREE_HOURS`, `SIX_HOURS`, `TWELVE_HOURS`, or `TWENTY_FOUR_HOURS`.
    enum:
    - ONE_HOUR
    - THREE_HOURS
    - SIX_HOURS
    - TWELVE_HOURS
    - TWENTY_FOUR_HOURS
  lockVersion:
    type: integer
    format: int64
    description: |
      The optimistic locking version of the quota policy. Include this value in PUT requests to prevent conflicting concurrent updates. See [Concurrency control](ref:concurrency-control) for details.
  createDate:
    type: string
    description: |
      The ISO 8601 timestamp when you created the quota policy.
    format: date-time
    readOnly: true
  createdBy:
    type: string
    description: |
      The identifier of the user who created the quota policy.
    readOnly: true
  updateDate:
    type: string
    description: |
      The ISO 8601 timestamp when you last updated the quota policy.
    format: date-time
    readOnly: true
  updatedBy:
    type: string
    description: |
      The identifier of the user who last updated the quota policy.
    readOnly: true
  used:
    type: boolean
    description: |
      Whether the quota policy is currently assigned to a security policy.
    readOnly: true
  clientIdentifiers:
    type: array
    description: |
      Client identifiers used to track individual request senders. The first identifier in the list is the primary one. If the primary identifier cannot be resolved, the next one in the list is used.
    items:
      $ref: quota-policy-client-identifier.yaml
  apiSelectors:
    type: array
    description: |
      The API endpoints to match in incoming requests. Only applies when `matchType` is `api`.
    items:
      type: object
      additionalProperties: false
      required:
      - apiDefinitionId
      properties:
        apiDefinitionId:
          type: integer
          format: int64
          description: |
            Uniquely identifies each API endpoint definition.
        resourceIds:
          type: array
          description: |
            The unique identifiers of specific resources within the API definition to match.
          items:
            type: integer
            format: int64
        undefinedResources:
          type: boolean
          description: |
            When `true`, match requests to any resource not explicitly added to the API definition, without requiring a `resourceId`. When `false`, you must pass a `resourceId`.
        definedResources:
          type: boolean
          description: |
            When `true`, match requests to any resource explicitly added to the API definition, without requiring a `resourceId`. When `false`, you must pass a `resourceId`.
  conditions:
    type: object
    description: |
      Enhanced match conditions that further filter which requests count toward the quota. When present, only requests that satisfy all conditions are counted.
    additionalProperties: false
    properties:
      id:
        type: integer
        format: int64
        description: |
          Uniquely identifies each condition set.
        readOnly: true
      uuid:
        type: string
        description: |
          A UUID that uniquely identifies the condition set.
        readOnly: true
      name:
        type: string
        description: |
          A descriptive name for the condition set.
      description:
        type: string
        description: |
          Descriptive text for the condition set.
      positiveMatch:
        type: boolean
        description: |
          Whether to count requests that match the conditions (`true`) or requests that don't match (`false`).
      canDelete:
        type: boolean
        description: |
          Whether this condition set can be deleted.
        readOnly: true
      version:
        type: integer
        format: int64
        description: |
          The version of the condition set.
        readOnly: true
      atomicConditions:
        type: array
        description: |
          The individual conditions that make up this condition set.
        items:
          oneOf:
          - $ref: request-header-condition-2.yaml
          - $ref: enhanced-condition-as-number.yaml
          - $ref: enhanced-condition-host.yaml
          - $ref: enhanced-condition-ip-address.yaml
          - $ref: enhanced-condition-file-extension.yaml
          - $ref: enhanced-condition-path.yaml
          - $ref: enhanced-condition-simple-atomic.yaml
          - $ref: enhanced-condition-check-ips.yaml
          - $ref: enhanced-condition-multi-name-atomic.yaml
          - $ref: enhanced-condition-value-case-and-wildcard.yaml
          - $ref: enhanced-condition-post-body.yaml
          - $ref: enhanced-condition-response-body.yaml
          - $ref: enhanced-condition-response-header.yaml
          - $ref: enhanced-condition-response-status.yaml
          - $ref: client-reputation-condition.yaml
          - $ref: enhanced-condition-request-method.yaml
          - $ref: enhanced-condition-query-string.yaml
          - $ref: enhanced-condition-url-pattern.yaml
          - $ref: enhanced-condition-filename.yaml
          - $ref: tls-fingerprint-condition.yaml
          - $ref: enhanced-condition-time.yaml
          - $ref: enhanced-condition-network-list.yaml

