type: object
description: |
  Collect data needed for a condition match on values with optional wildcard and case-sensitivity controls.
title: ValueCaseAndWildcardCondition
additionalProperties: false
required:
- className
- value
properties:
  className:
    type: string
    description: |
      The value for this type of condition is `ValueCaseAndWildcardCondition`.
    enum:
    - ValueCaseAndWildcardCondition
  positiveMatch:
    type: boolean
    description: |
      Specify whether the condition triggers on a match or lack of match.
  index:
    type: integer
    description: |
      Specify the position of this condition within the condition set.
  value:
    type: array
    description: |
      Specify values to match against.
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  valueCase:
    type: boolean
    description: |
      Specify whether to consider the case sensitivity of the provided values.
  valueWildcard:
    type: boolean
    description: |
      Specify whether to interpret `*` and `?` as wildcards when matching values.
