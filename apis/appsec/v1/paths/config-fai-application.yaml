x-akamai:
  # These are no-op, & clarify what endpoint this file's methods apply to
  path-info: /configs/{configId}/versions/{versionNumber}/fai-applications/{faiApplicationId}
parameters:
- $ref: ../parameters/config-id-path.yaml
- $ref: ../parameters/version-number-path.yaml
- $ref: ../parameters/fai-application-id-path.yaml
get:
  operationId: get-fai-application
  summary: Get an FAI application
  tags:
  - FAI applications
  description: |
    Returns the specified FAI application.
  x-akamai:
    labels:
    - All products
  responses:
    200:
      description: |
        Successfully returned FAI application.
      content:
        application/json:
          example:
            $ref: ../examples/fai-application-200.json
          schema:
            $ref: ../schemas/fai-application.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have access to FAI applications in this security configuration.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). The security configuration version or FAI application wasn't found.
      $ref: ../errors/404.yaml
put:
  operationId: put-fai-application
  summary: Modify an FAI application
  tags:
  - FAI applications
  description: |
    Update details for a specific FAI application.
  x-akamai:
    labels:
    - All products
  requestBody:
    required: true
    content:
      application/json:
        example:
          $ref: ../examples/fai-application-put.json
        schema:
          $ref: ../schemas/fai-application.yaml
  responses:
    200:
      description: |
        Successfully updated FAI application.
      content:
        application/json:
          example:
            $ref: ../examples/fai-application-200.json
          schema:
            $ref: ../schemas/fai-application.yaml
    400:
      $ref: ../errors/400.yaml
    403:
      description: |
        [Forbidden](ref:403). You don't have access to FAI applications in this security configuration.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). The security configuration version or FAI application wasn't found.
      $ref: ../errors/404.yaml
delete:
  operationId: delete-fai-application
  summary: Remove an FAI application
  tags:
  - FAI applications
  description: |
    Delete a specific FAI application.
  x-akamai:
    labels:
    - All products
  responses:
    204:
      description: |
        Successfully deleted the FAI application.
    403:
      description: |
        [Forbidden](ref:403). You don't have access to FAI applications in this security configuration.
      $ref: ../errors/403.yaml
    404:
      description: |
        [Not found](ref:404). The security configuration version or FAI application wasn't found.
      $ref: ../errors/404.yaml
